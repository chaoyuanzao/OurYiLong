<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平面图热区交互｜点击锁定选中状态</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#111;
  min-height:100vh;
  color:#fff;
  overflow:hidden;
}
/* ========== 顶部状态栏 ========== */
#topStatusBar{
  width:100%;
  background:rgba(0,0,0,0.75);
  display:flex;
  align-items:center;
  gap:16px;
  padding:8px 16px;
  flex-wrap:wrap;
  z-index:1001;
}
#topStatusBar .time-area{
  display:flex;
  align-items:center;
  gap:8px;
}
#topStatusBar .stat-row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
#topStatusBar .stat-item{
  font-size:14px;
}
#topStatusBar button{
  padding:3px 7px;
  border:none;
  border-radius:3px;
  cursor:pointer;
  background:#336;
  color:#fff;
}
#topStatusBar .top-right-buttons{
  margin-left:auto;
  display:flex;
  gap:8px;
}
#mainWrap{
  display:flex;
  height:calc(100vh - 48px);
}
#mapWrap{
  flex:1;
  padding:12px;
  display:flex;
  justify-content:center;
  overflow:auto;
}
#mapSvg{
  width:95vw;
  max-width:1509px;
}
.piece{
  fill:transparent;
  stroke:none;
  transition: all 0.25s ease;
  cursor:pointer;
}
.piece:hover{
  fill:rgba(120, 200, 255, 0.28);
  filter: drop-shadow(0 0 7px rgba(120, 200, 255, 0.45));
}
.piece.active{
  stroke:#ffffff;
  stroke-width:2;
  fill:rgba(120, 200, 255, 0.38);
}
/* ========== 右侧全局决策面板（支持收起） ========== */
#rightGlobalPanelWrap{
  position:relative;
}
#rightGlobalPanel{
  width:320px;
  background:#222;
  padding:16px;
  border-left:1px solid #444;
  overflow-y:auto;
  height:100%;
  transition: width 0.3s ease, padding 0.3s ease;
}
#rightGlobalPanel.collapsed{
  width:0px;
  padding:0;
  overflow:hidden;
  border:none;
}
#togglePanelBtn{
  position:absolute;
  left:-24px;
  top:12px;
  width:24px;
  height:32px;
  background:#333;
  color:#fff;
  border:none;
  border-radius:4px 0 0 4px;
  cursor:pointer;
  z-index:10;
}
.logoBox{
  text-align:center;
  margin-bottom:16px;
}
.logoBox img{
  width:100px;
}
#globalPieChart{
  width:100%;
  height:220px;
}
/* 悬浮提示 */
#tooltipHover{
  position:fixed;
  pointer-events:none;
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:6px 10px;
  border-radius:4px;
  font-size:14px;
  white-space:nowrap;
  display:none;
  z-index:999;
}
#tooltipSelected{
  position:fixed;
  left:20px;
  top:60px;
  pointer-events:none;
  background:rgba(0,0,0,0.8);
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
  font-size:16px;
  font-weight:bold;
  display:none;
  z-index:999;
  line-height:1.4;
}
#tooltipSelected .desc{
  font-size:13px;
  font-weight:normal;
  opacity:0.8;
  margin-top:3px;
}
/* ========== 区块详情弹窗 ========== */
.infoPanel{
  position:fixed;
  left:50%;
  bottom:20px;
  transform: translateX(-50%);
  width:420px;
  min-width:280px;
  max-width:94vw;
  max-height:55vh;
  background:#222;
  color:#fff;
  border-radius:8px;
  border:1px solid #444;
  box-shadow:0 4px 20px #0008;
  display:none;
  overflow:hidden;
  z-index:1000;
}
.panelHeader{
  padding:10px 14px;
  background:#333;
  display:flex;
  justify-content:space-between;
  align-items:center;
  user-select:none;
}
.panelClose{
  padding:2px 8px;
  cursor:pointer;
  background:#444;
  border:none;
  color:#fff;
  border-radius:4px;
}
.panelContent{
  padding:14px;
  overflow:auto;
  max-height:calc(100% - 50px);
}
.chartWrap{
  width:100%;
  height:180px;
  margin:12px 0;
}
/* ========== 事件弹窗 ========== */
.eventOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.eventBox{
  background:#222;
  border:1px solid #666;
  border-radius:10px;
  max-width:520px;
  width:100%;
  padding:20px;
}
.eventTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
  color:#ffdd77;
}
.eventDesc{
  line-height:1.6;
  margin-bottom:20px;
  font-size:15px;
  white-space: pre-wrap;
}
.eventOption{
  display:block;
  width:100%;
  padding:10px 14px;
  margin:8px 0;
  background:#335;
  border:none;
  border-radius:6px;
  color:#fff;
  text-align:left;
  cursor:pointer;
  transition:0.2s;
}
.eventOption:hover{
  background:#447;
}
/* ========== 左侧决议面板 ========== */
#resolutionPanel{
  position:fixed;
  top:48px;
  left:0;
  width:260px;
  max-width:92vw;
  background:#222;
  border:1px solid #444;
  border-left:none;
  border-radius:0 8px 8px 0;
  z-index:1002;
  transition: transform 0.3s ease;
  max-height:calc(100vh - 52px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
#resolutionPanel.hidden{
  transform: translateX(-100%);
}
.resPanelHeader{
  padding:10px 12px;
  background:#333;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.resContent{
  padding:10px;
  overflow-y:auto;
  flex-grow:1;
}
.resCategoryTitle{
  font-size:15px;
  color:#aad;
  margin:10px 0 4px;
  border-bottom:1px solid #344;
}
.resItem{
  padding:8px;
  border:1px solid #444;
  border-radius:6px;
  margin-bottom:8px;
}
.resItem.disabled{
  opacity:0.45;
}
.resItem h4{
  margin-bottom:4px;
  font-size:14px;
}
.resItem .timeNeed{
  font-size:13px;
  opacity:0.7;
}
.resItem .outsourceNeed{
  font-size:13px;
  color:#fc9;
}
.resItem .progress{
  height:6px;
  width:100%;
  background:#333;
  border-radius:3px;
  margin:6px 0;
}
.resItem .progress>div{
  height:100%;
  background:#6ac;
  border-radius:3px;
}
.resItem button{
  margin-top:4px;
  padding:3px 6px;
  background:#336;
  color:#fff;
  border:none;
  border-radius:3px;
  cursor:pointer;
}
.resItem button:disabled{
  background:#223;
  cursor:not-allowed;
}
/* ========== 右下角日志面板 ========== */
#logPanel{
  position:fixed;
  bottom:20px;
  right:20px;
  width:300px;
  max-width:92vw;
  height:320px;
  background:#222;
  border:1px solid #444;
  border-radius:8px;
  z-index:1001;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  display:none;
}
.logPanelHeader{
  padding:8px 10px;
  background:#333;
  display:flex;
  justify-content:space-between;
}
.logContent{
  padding:8px;
  overflow-y:auto;
  flex-grow:1;
  font-size:13px;
  line-height:1.4;
}
.logItem{
  padding:4px 0;
  border-bottom:1px solid #333;
}
@media (max-width:768px){
  #mainWrap{flex-direction:column;}
  #rightGlobalPanel{width:100%;height:auto;}
  #resolutionPanel{width:240px;top:60px;max-height:calc(100vh - 64px);}
  .infoPanel{bottom:10px;width:94vw;}
  #logPanel{right:10px;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const tooltipHover = document.getElementById('tooltipHover');
const tooltipSelected = document.getElementById('tooltipSelected');
const selectedNameDom = tooltipSelected.querySelector('.name');
const selectedDescDom = tooltipSelected.querySelector('.desc');
const pieces = document.querySelectorAll('.piece');
let activeItem = null;

const panelTitle = document.getElementById('panelTitle');
const powerDom = document.getElementById('power');
const floorDom = document.getElementById('floor');
const facilityDom = document.getElementById('facilityList');
const pieLegendDom = document.getElementById('pieLegend');
let pieChart = null;
let decisionPieChart = null;
const eventOverlay = document.getElementById('eventOverlay');
const eventTitle = document.getElementById('eventTitle');
const eventDesc = document.getElementById('eventDesc');
const eventOptionWrap = document.getElementById('eventOptionWrap');
const toggleLeftResBtn = document.getElementById('toggleLeftResBtn');
const resolutionPanel = document.getElementById('resolutionPanel');
const closeResBtn = document.getElementById('closeResBtn');
const resContent = document.getElementById('resContent');
const toggleLogBtn = document.getElementById('toggleLogBtn');
const logPanel = document.getElementById('logPanel');
const closeLogBtn = document.getElementById('closeLogBtn');
const logContent = document.getElementById('logContent');
const clearLogBtn = document.getElementById('clearLogBtn');
let eventLogList = [];
// 右侧面板折叠控制
const rightPanel = document.getElementById('rightGlobalPanel');
const togglePanelBtn = document.getElementById('togglePanelBtn');
togglePanelBtn.onclick = ()=>{
  rightPanel.classList.toggle('collapsed');
  togglePanelBtn.innerText = rightPanel.classList.contains('collapsed') ? "展开" : "收起";
};
// ===================== 决议系统（改为消耗外勤） =====================
let runningResolutions = [];
const resolutionPool = [
  {
    id:"res_build_classroom",
    category:"基建",
    title:"翻新老旧教室",
    desc:"对一号楼教室进行翻新改造",
    needHour:24,
    outsourceCost:12, // 消耗外勤人数
    cost:{money:-30000},
    reward:{satisfaction:+8, stability:+4},
    condition: function(state, usedOutsource){
      return state.money >= 30000 && (state.outsource - usedOutsource) >= this.outsourceCost;
    }
  },
  {
    id:"res_hire_staff",
    category:"人事",
    title:"招募外勤人员",
    desc:"花钱雇佣外勤，用于执行各类决议项目",
    needHour:6,
    outsourceCost:0,
    cost:{money:-12000},
    reward:{outsource:+10},
    condition: function(state, usedOutsource){
      return state.money >=12000;
    }
  },
  {
    id:"res_plant_tree",
    category:"基建",
    title:"校园绿化补种",
    desc:"补种绿植，提升校园满意度",
    needHour:8,
    outsourceCost:5,
    cost:{money:-5000},
    reward:{satisfaction:+3, stability:+2},
    condition: function(state, usedOutsource){
      return state.money >=5000 && (state.outsource - usedOutsource) >= this.outsourceCost;
    }
  },
  {
    id:"res_meeting",
    category:"行政",
    title:"教职工大会",
    desc:"召开教职工会议，稳定人心",
    needHour:4,
    outsourceCost:0,
    cost:{money:-1000},
    reward:{stability:+4},
    condition: function(state, usedOutsource){
      return state.money >=1000;
    }
  }
];
function getUsedOutsource(){
  return runningResolutions.reduce((sum, r)=> sum + r.outsourceCost, 0);
}
// 日志函数
function addLog(text){
  const timeStr = `${gameDate.month}月${gameDate.day}日 ${String(gameDate.hour).padStart(2,'0')}:00`;
  const logItem = `[${timeStr}] ${text}`;
  eventLogList.unshift(logItem);
  renderLog();
}
function renderLog(){
  logContent.innerHTML = '';
  eventLogList.forEach(item=>{
    const div = document.createElement('div');
    div.className="logItem";
    div.innerText = item;
    logContent.appendChild(div);
  })
}
clearLogBtn.onclick = ()=>{
  eventLogList = [];
  renderLog();
}
closeLogBtn.onclick = ()=> logPanel.style.display = "none";
toggleLogBtn.onclick = ()=>{
  logPanel.style.display = logPanel.style.display === "block" ? "none" : "block";
}
//决议面板开关
toggleLeftResBtn.onclick = ()=>{
  resolutionPanel.classList.toggle('hidden');
}
closeResBtn.onclick = ()=>{
  resolutionPanel.classList.add('hidden');
}
//渲染决议列表
function renderResolutions(){
  const usedOutsource = getUsedOutsource();
  resContent.innerHTML = "";
  const group = {};
  resolutionPool.forEach(r=>{
    if(!group[r.category]) group[r.category] = [];
    group[r.category].push(r);
  })
  for(let cat in group){
    const catTitle = document.createElement('div');
    catTitle.className = "resCategoryTitle";
    catTitle.innerText = cat;
    resContent.appendChild(catTitle);
    group[cat].forEach(res=>{
      const div = document.createElement('div');
      div.className="resItem";
      const runningRes = runningResolutions.find(r=>r.id === res.id);
      let progressPercent = 0;
      let isRunning = !!runningRes;
      let canTrigger = res.condition(gameState, usedOutsource);
      if(isRunning){
        progressPercent = Math.min(100, (runningRes.progress / res.needHour)*100);
      }
      if(!canTrigger && !isRunning) div.classList.add("disabled");
      div.innerHTML = `
        <h4>${res.title}</h4>
        <div>${res.desc}</div>
        <div class="timeNeed">耗时：${res.needHour}游戏小时</div>
        <div class="outsourceNeed">占用外勤：${res.outsourceCost}</div>
        ${isRunning ? `<div class="progress"><div style="width:${progressPercent}%"></div></div>` : ""}
        <button data-res-id="${res.id}" ${isRunning || !canTrigger ? "disabled" : ""}>
          ${isRunning ? "执行中..." : (canTrigger ? "启动决议" : "条件不足")}
        </button>
      `;
      resContent.appendChild(div);
    })
  }
  document.querySelectorAll('.resItem button').forEach(btn=>{
    btn.onclick = ()=>{
      const rid = btn.dataset.resId;
      const targetRes = resolutionPool.find(r=>r.id === rid);
      const usedOutsource = getUsedOutsource();
      if(!targetRes || runningResolutions.find(r=>r.id===rid) || !targetRes.condition(gameState, usedOutsource)) return;
      runningResolutions.push({
        id:targetRes.id,
        progress:0,
        outsourceCost: targetRes.outsourceCost
      })
      addLog(`启动决议：${targetRes.title}，占用外勤${targetRes.outsourceCost}`);
      refreshStatUI();
      renderResolutions();
    }
  })
}
function tickResolution(){
  const usedOutsource = getUsedOutsource();
  for(let i = runningResolutions.length -1; i >=0; i--){
    const runRes = runningResolutions[i];
    const resDef = resolutionPool.find(r=>r.id === runRes.id);
    if(!resDef){
      runningResolutions.splice(i,1);
      continue;
    }
    runRes.progress += timeSpeed;
    if(runRes.progress >= resDef.needHour){
      for(let key in resDef.cost){
        gameState[key] += resDef.cost[key];
      }
      for(let key in resDef.reward){
        gameState[key] += resDef.reward[key];
      }
      gameState.stability = Math.max(0, Math.min(100, gameState.stability));
      gameState.satisfaction = Math.max(0, Math.min(100, gameState.satisfaction));
      gameState.admitRate = Math.max(0, Math.min(100, gameState.admitRate));
      gameState.money = Math.max(0, gameState.money);
      gameState.outsource = Math.max(0, gameState.outsource);
      addLog(`决议【${resDef.title}】完成！释放外勤${resDef.outsourceCost}`);
      runningResolutions.splice(i,1);
    }
  }
  refreshStatUI();
  renderResolutions();
}
// 决策层势力饼图（右侧全局面板）
function renderDecisionPie(){
  if(decisionPieChart) decisionPieChart.destroy();
  const data = gameState.decisionPower;
  const ctx = document.getElementById('globalPieChart').getContext('2d');
  decisionPieChart = new Chart(ctx,{
    type:'pie',
    data:{
      labels:["教职工","学生会","普通学生"],
      datasets:[{
        data:[data.staff, data.studentUnion, data.normalStudent],
        backgroundColor:["#74c476","#ffbc42","#4292c6"]
      }]
    },
    options:{responsive:true, maintainAspectRatio:false}
  })
}
/**
 * 修改决策层权重
 * @param {Object} change 例如 {staff:-2, normalStudent:+2}
 */
function changeDecisionPower(change){
  for(let key in change){
    gameState.decisionPower[key] += change[key];
  }
  //归一化，强制限制0~100，总和保持100
  const dp = gameState.decisionPower;
  let total = dp.staff + dp.studentUnion + dp.normalStudent;
  dp.staff = Math.max(0, dp.staff / total * 100);
  dp.studentUnion = Math.max(0, dp.studentUnion / total * 100);
  dp.normalStudent = Math.max(0, dp.normalStudent / total * 100);
  //重新归一，防止出现负数
  const newTotal = dp.staff + dp.studentUnion + dp.normalStudent;
  dp.staff = dp.staff / newTotal * 100;
  dp.studentUnion = dp.studentUnion / newTotal * 100;
  dp.normalStudent = dp.normalStudent / newTotal * 100;
  renderDecisionPie(); //刷新饼图
}
// 地块内饼图
function renderPie(pieStr){
  if(pieChart) pieChart.destroy();
  pieLegendDom.innerHTML = '';
  const parts = pieStr.split(';');
  const labels = [];
  const data = [];
  const colors = [];
  parts.forEach(p=>{
    const [label,val,color] = p.split(',');
    labels.push(label);
    data.push(Number(val));
    colors.push(color);
    pieLegendDom.innerHTML += `<div style="color:${color}">${label}: ${val}%</div>`
  })
  const ctx = document.getElementById('pieChart').getContext('2d');
  pieChart = new Chart(ctx,{
    type:'pie',
    data:{
      labels:labels,
      datasets:[{data:data, backgroundColor:colors}]
    },
    options:{responsive:true, maintainAspectRatio:false}
  })
}
function closePanelAndClear(){
  infoPanel.style.display = 'none';
  tooltipSelected.style.display = 'none';
  if(activeItem){
    activeItem.classList.remove('active');
  }
  activeItem = null;
}
panelClose.onclick = closePanelAndClear;
document.addEventListener('click', (e)=>{
  if(infoPanel.style.display !== 'block') return;
  if(infoPanel.contains(e.target)) return;
  closePanelAndClear();
});
pieces.forEach(el => {
  el.addEventListener('mouseenter', (e) => {
    tooltipHover.textContent = el.dataset.name;
    tooltipHover.style.display = 'block';
  });
  el.addEventListener('mousemove', (e) => {
    tooltipHover.style.left = (e.clientX + 12) + 'px';
    tooltipHover.style.top = (e.clientY + 12) + 'px';
  });
  el.addEventListener('mouseleave', () => {
    tooltipHover.style.display = 'none';
  });
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    if(activeItem === el){
      closePanelAndClear();
    }else{
      if(activeItem){
        activeItem.classList.remove('active');
      }
      el.classList.add('active');
      activeItem = el;
      selectedNameDom.textContent = el.dataset.name;
      selectedDescDom.textContent = el.dataset.desc;
      tooltipSelected.style.display = 'block';
      panelTitle.innerText = el.dataset.name;
      powerDom.innerText = el.dataset.power;
      floorDom.innerText = el.dataset.floor;
      facilityDom.innerText = el.dataset.facility;
      renderPie(el.dataset.pie);
      infoPanel.style.display = 'block';
    }
  });
});
//游戏时间系统
const gameTimeDom = document.getElementById('gameTime');
const statStability = document.getElementById('statStability');
const statSatisfaction = document.getElementById('statSatisfaction');
const statMoney = document.getElementById('statMoney');
const statOutsource = document.getElementById('statOutsource');
const statAdmit = document.getElementById('statAdmit');
let gameDate = {month:9, day:1, hour:8};
let timeSpeed = 1;
const btnPause = document.getElementById('btnPause');
const btnSpeed1 = document.getElementById('btnSpeed1');
const btnSpeed3 = document.getElementById('btnSpeed3');
const btnSpeed10 = document.getElementById('btnSpeed10');
btnPause.onclick = ()=> {
  if(timeSpeed === 0){
    timeSpeed = 1;
    btnPause.innerText = "暂停";
  }else{
    timeSpeed = 0;
    btnPause.innerText = "继续";
  }
};
btnSpeed1.onclick = ()=> { timeSpeed =1; btnPause.innerText="暂停"; };
btnSpeed3.onclick = ()=> { timeSpeed =3; btnPause.innerText="暂停"; };
btnSpeed10.onclick = ()=> { timeSpeed =10; btnPause.innerText="暂停"; };
function renderGameTime(){
  let h = String(gameDate.hour).padStart(2,'0');
  gameTimeDom.textContent = `${gameDate.month}月${gameDate.day}日 ${h}:00`;
}
const gameState = {
  stability: 85,
  satisfaction:78,
  money:250000,
  admitRate:62,
  outsource:0, //外勤人力，花钱招募
  // ========== 新增决策层势力占比 总和=100 ==========
  decisionPower:{
    staff:95,        //教职工
    studentUnion:4,  //学生会
    normalStudent:1  //普通学生
  }
};
function refreshStatUI(){
  const usedOutsource = getUsedOutsource();
  const freeOutsource = gameState.outsource - usedOutsource;
  statStability.textContent = gameState.stability.toFixed(1);
  statSatisfaction.textContent = gameState.satisfaction.toFixed(1);
  statMoney.textContent = Math.floor(gameState.money);
  statOutsource.textContent = `${freeOutsource}/${gameState.outsource}`;
  statAdmit.textContent = gameState.admitRate.toFixed(0)+"%";
  renderResolutions();
}
refreshStatUI();
//事件系统
const eventPool = [
  {
    id:"event_first_day",
    triggered:false,
    condition: function(){
      return gameDate.month ===9 && gameDate.day ===1 && gameDate.hour >=8;
    },
    title:"开学第一天",
    desc:"主席台上那个带着眼镜的中年男人不见了，取而代之的是一个女人，响彻操场的声音“同学们大家好，我是你们的新校长殷海霞”，在新官上任约法三章之后，本学期的第一次校会落幕了，八九年级被疏散回班，他们没有机会看到七年级的“长征”队伍前往那个被称为新校区的地方了，他们来的地方，“以先驱的身份，祝福他们好运。”一个九年级学长这样说到。不知道新校长的到来会给这个逐渐衰落的学校带来什么改变呢？",
    options:[
      {
        text:"纪文再见，海霞同志您好",
        effect:{
          money:0, 
          satisfaction:+5, 
          stability:+5, 
          admitRate:0, 
          outsource:0,
          decisionPower:{staff:+2, normalStudent:-2}
        }
      },
      {
        text:"纪文我们想你了",
        effect:{
          money:0, 
          satisfaction:-3, 
          stability:-2, 
          admitRate:0, 
          outsource:0,
          decisionPower:{staff:-3, studentUnion:+3}
        }
      }
    ]
  },
  {
    id:"event_money_short",
    triggered:false,
    condition:function(){
      return gameState.money < 100000;
    },
    title:"经费紧张警告",
    desc:"学校账户资金不足，部分维护项目面临停工风险。校董事会向你询问后续方案。",
    options:[
      {
        text:"削减非必要绿化维护",
        effect:{money:+20000, stability:-4, satisfaction:0, admitRate:0, outsource:0}
      },
      {
        text:"申请向上级追加拨款",
        effect:{money:+10000, satisfaction:+2, stability:0, admitRate:0, outsource:0}
      }
    ]
  }
];
function showEvent(eventObj){
  eventTitle.innerText = eventObj.title;
  eventDesc.innerText = eventObj.desc;
  eventOptionWrap.innerHTML = '';
  eventObj.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = "eventOption";
    let effectTextParts = [];
    if(opt.effect.stability !== 0) effectTextParts.push(`稳定度 ${opt.effect.stability >0 ? '+' : ''}${opt.effect.stability}`);
    if(opt.effect.satisfaction !== 0) effectTextParts.push(`满意度 ${opt.effect.satisfaction >0 ? '+' : ''}${opt.effect.satisfaction}`);
    if(opt.effect.money !== 0) effectTextParts.push(`资金 ${opt.effect.money >0 ? '+' : ''}${opt.effect.money}`);
    if(opt.effect.admitRate !== 0) effectTextParts.push(`升学率 ${opt.effect.admitRate >0 ? '+' : ''}${opt.effect.admitRate}`);
    if(opt.effect.outsource !== 0) effectTextParts.push(`外勤 ${opt.effect.outsource >0 ? '+' : ''}${opt.effect.outsource}`);
    //决策层势力变化文字
    if(opt.effect.decisionPower){
      const dp = opt.effect.decisionPower;
      if(dp.staff) effectTextParts.push(`教职工话语权 ${dp.staff>0?'+':''}${dp.staff}%`);
      if(dp.studentUnion) effectTextParts.push(`学生会话语权 ${dp.studentUnion>0?'+':''}${dp.studentUnion}%`);
      if(dp.normalStudent) effectTextParts.push(`普通学生话语权 ${dp.normalStudent>0?'+':''}${dp.normalStudent}%`);
    }
    const effectText = effectTextParts.join('，');
    btn.innerHTML = `
      <div>${opt.text}</div>
      <div style="font-size:12px;opacity:0.7;margin-top:4px;">${effectText}</div>
    `;
    btn.onclick = ()=>{
      gameState.stability += opt.effect.stability;
      gameState.satisfaction += opt.effect.satisfaction;
      gameState.money += opt.effect.money;
      gameState.admitRate += opt.effect.admitRate;
      gameState.outsource += opt.effect.outsource;
      gameState.stability = Math.max(0, Math.min(100, gameState.stability));
      gameState.satisfaction = Math.max(0, Math.min(100, gameState.satisfaction));
      gameState.admitRate = Math.max(0, Math.min(100, gameState.admitRate));
      gameState.outsource = Math.max(0, gameState.outsource);
      refreshStatUI();
      addLog(`事件【${eventObj.title}】选择：${opt.text}，变动：${effectText}`);

      // ========== 新增：如果选项有decisionPower，就执行权重修改 ==========
      if(opt.effect.decisionPower){
        changeDecisionPower(opt.effect.decisionPower);
        addLog(`决策层势力发生变动`);
      }

      eventOverlay.style.display = "none";
    };
    eventOptionWrap.appendChild(btn);
  })
  eventOverlay.style.display = "flex";
  addLog(`触发事件：${eventObj.title}`);
}
function checkEvents(){
  for(let evt of eventPool){
    if(evt.triggered) continue;
    if(evt.condition()){
      evt.triggered = true;
      showEvent(evt);
      break;
    }
  }
}
function tickGameTime(){
  if(timeSpeed === 0) return;
  gameDate.hour += timeSpeed;
  if(gameDate.hour >=24){
    gameDate.hour -= 24;
    gameDate.day += 1;
    const monthDayMap = {9:30,10:31,11:30,12:31};
    const maxDay = monthDayMap[gameDate.month] ?? 30;
    if(gameDate.day > maxDay){
      gameDate.day = 1;
      gameDate.month += 1;
    }
  }
  renderGameTime();
  checkEvents();
  tickResolution();
}
//初始化
renderGameTime();
renderResolutions();
renderLog();
renderDecisionPie();
setInterval(tickGameTime, 1000);
</script>
