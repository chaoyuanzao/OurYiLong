<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 移动端视口 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平面图热区交互｜点击锁定选中状态</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#111;
  min-height:100vh;
  color:#fff;
}
/* ========== 顶部横向状态栏 ========== */
#topStatusBar{
  width:100%;
  background:rgba(0,0,0,0.75);
  display:flex;
  align-items:center;
  gap:16px;
  padding:8px 16px;
  flex-wrap:wrap;
  z-index:1001;
}
#topStatusBar .time-area{
  display:flex;
  align-items:center;
  gap:8px;
}
#topStatusBar .stat-row{
  display:flex;
  gap:14px;
}
#topStatusBar .stat-item{
  font-size:14px;
}
#topStatusBar button{
  padding:3px 7px;
  border:none;
  border-radius:3px;
  cursor:pointer;
  background:#336;
  color:#fff;
}
#mapWrap{
  width:100%;
  padding:12px;
  display:flex;
  justify-content:center;
}
#mapSvg{
  width:95vw;
  max-width:1509px;
}
.piece{
  fill:transparent;
  stroke:none;
  transition: all 0.25s ease;
  cursor:pointer;
}
/* 鼠标悬浮临时效果 */
.piece:hover{
  fill:rgba(120, 200, 255, 0.28);
  filter: drop-shadow(0 0 7px rgba(120, 200, 255, 0.45));
}
/* 点击选中后的持久状态：白边 + 填充 */
.piece.active{
  stroke:#ffffff;
  stroke-width:2;
  fill:rgba(120, 200, 255, 0.38);
}
/* 悬浮临时提示（跟随鼠标） */
#tooltipHover{
  position:fixed;
  pointer-events:none;
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:6px 10px;
  border-radius:4px;
  font-size:14px;
  white-space:nowrap;
  display:none;
  z-index:999;
}
/* 选中后固定显示的名称提示 */
#tooltipSelected{
  position:fixed;
  left:20px;
  top:60px; /* 避开顶部状态栏 */
  pointer-events:none;
  background:rgba(0,0,0,0.8);
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
  font-size:16px;
  font-weight:bold;
  display:none;
  z-index:999;
  line-height:1.4;
}
#tooltipSelected .desc{
  font-size:13px;
  font-weight:normal;
  opacity:0.8;
  margin-top:3px;
}

/* ========== 详情面板【底部居中】 ========== */
.infoPanel{
  position:fixed;
  left:50%;
  bottom:20px;
  transform: translateX(-50%);
  width:420px;
  min-width:280px;
  max-width:94vw;
  max-height:55vh;
  background:#222;
  color:#fff;
  border-radius:8px;
  border:1px solid #444;
  box-shadow:0 4px 20px #0008;
  display:none;
  overflow:hidden;
  z-index:1000;
}
.panelHeader{
  padding:10px 14px;
  background:#333;
  display:flex;
  justify-content:space-between;
  align-items:center;
  user-select:none;
}
.panelClose{
  padding:2px 8px;
  cursor:pointer;
  background:#444;
  border:none;
  color:#fff;
  border-radius:4px;
}
.panelContent{
  padding:14px;
  overflow:auto;
  max-height:calc(100% - 50px);
}
.chartWrap{
  width:100%;
  height:180px;
  margin:12px 0;
}

/* ========== 事件弹窗【新增】 ========== */
.eventOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.eventBox{
  background:#222;
  border:1px solid #666;
  border-radius:10px;
  max-width:520px;
  width:100%;
  padding:20px;
}
.eventTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
  color:#ffdd77;
}
.eventDesc{
  line-height:1.6;
  margin-bottom:20px;
  font-size:15px;
  white-space: pre-wrap;
}
.eventOption{
  display:block;
  width:100%;
  padding:10px 14px;
  margin:8px 0;
  background:#335;
  border:none;
  border-radius:6px;
  color:#fff;
  text-align:left;
  cursor:pointer;
  transition:0.2s;
}
.eventOption:hover{
  background:#447;
}

@media (max-width:768px){
  .infoPanel{
    bottom:10px;
    width:94vw;
  }
  #topStatusBar{
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
  }
}
</style>
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<script>
const tooltipHover = document.getElementById('tooltipHover');
const tooltipSelected = document.getElementById('tooltipSelected');
const selectedNameDom = tooltipSelected.querySelector('.name');
const selectedDescDom = tooltipSelected.querySelector('.desc');
const pieces = document.querySelectorAll('.piece');
let activeItem = null;

// 面板元素
const infoPanel = document.getElementById('infoPanel');
const panelClose = document.getElementById('panelClose');
const panelTitle = document.getElementById('panelTitle');
const powerDom = document.getElementById('power');
const floorDom = document.getElementById('floor');
const facilityDom = document.getElementById('facilityList');
const pieLegendDom = document.getElementById('pieLegend');
let pieChart = null;

// 事件弹窗元素
const eventOverlay = document.getElementById('eventOverlay');
const eventTitle = document.getElementById('eventTitle');
const eventDesc = document.getElementById('eventDesc');
const eventOptionWrap = document.getElementById('eventOptionWrap');

// 判断触摸设备
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if(isTouchDevice){
  tooltipHover.style.display = "none";
}

panelClose.onclick = ()=>{
  closePanelAndClear();
};

// 渲染饼图函数
function renderPie(pieStr){
  if(pieChart) pieChart.destroy();
  pieLegendDom.innerHTML = '';
  const parts = pieStr.split(';');
  const labels = [];
  const data = [];
  const colors = [];
  parts.forEach(p=>{
    const [label,val,color] = p.split(',');
    labels.push(label);
    data.push(Number(val));
    colors.push(color);
    pieLegendDom.innerHTML += `<div style="color:${color}">${label}: ${val}%</div>`
  })
  const ctx = document.getElementById('pieChart').getContext('2d');
  pieChart = new Chart(ctx,{
    type:'pie',
    data:{
      labels:labels,
      datasets:[{data:data, backgroundColor:colors}]
    },
    options:{responsive:true, maintainAspectRatio:false}
  })
}

function closePanelAndClear(){
  infoPanel.style.display = 'none';
  tooltipSelected.style.display = 'none';
  if(activeItem){
    activeItem.classList.remove('active');
  }
  activeItem = null;
}

// 点击空白区域关闭面板
document.addEventListener('click', (e)=>{
  if(infoPanel.style.display !== 'block') return;
  if(infoPanel.contains(e.target)) return;
  closePanelAndClear();
});

pieces.forEach(el => {
  el.addEventListener('mouseenter', (e) => {
    tooltipHover.textContent = el.dataset.name;
    tooltipHover.style.display = 'block';
  });
  el.addEventListener('mousemove', (e) => {
    tooltipHover.style.left = (e.clientX + 12) + 'px';
    tooltipHover.style.top = (e.clientY + 12) + 'px';
  });
  el.addEventListener('mouseleave', () => {
    tooltipHover.style.display = 'none';
  });
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    if(activeItem === el){
      closePanelAndClear();
    }else{
      if(activeItem){
        activeItem.classList.remove('active');
      }
      el.classList.add('active');
      activeItem = el;
      selectedNameDom.textContent = el.dataset.name;
      selectedDescDom.textContent = el.dataset.desc;
      tooltipSelected.style.display = 'block';

      panelTitle.innerText = el.dataset.name;
      powerDom.innerText = el.dataset.power;
      floorDom.innerText = el.dataset.floor;
      facilityDom.innerText = el.dataset.facility;
      renderPie(el.dataset.pie);
      infoPanel.style.display = 'block';
    }
  });
});

// ===================== 游戏时间系统 =====================
const gameTimeDom = document.getElementById('gameTime');
const statStability = document.getElementById('statStability');
const statSatisfaction = document.getElementById('statSatisfaction');
const statMoney = document.getElementById('statMoney');
const statAdmit = document.getElementById('statAdmit');

let gameDate = {
  month:9,
  day:1,
  hour:8
};
let timeSpeed = 1;
const btnPause = document.getElementById('btnPause');
const btnSpeed1 = document.getElementById('btnSpeed1');
const btnSpeed3 = document.getElementById('btnSpeed3');
const btnSpeed10 = document.getElementById('btnSpeed10');

// 修复暂停：切换状态
btnPause.onclick = ()=> {
  if(timeSpeed === 0){
    timeSpeed = 1;
    btnPause.innerText = "暂停";
  }else{
    timeSpeed = 0;
    btnPause.innerText = "继续";
  }
};
btnSpeed1.onclick = ()=> { timeSpeed =1; btnPause.innerText="暂停"; };
btnSpeed3.onclick = ()=> { timeSpeed =3; btnPause.innerText="暂停"; };
btnSpeed10.onclick = ()=> { timeSpeed =10; btnPause.innerText="暂停"; };

function renderGameTime(){
  let h = String(gameDate.hour).padStart(2,'0');
  gameTimeDom.textContent = `${gameDate.month}月${gameDate.day}日 ${h}:00`;
}

// 全局游戏状态
const gameState = {
  stability: 85,
  satisfaction:78,
  money:250000,
  admitRate:62
};
function refreshStatUI(){
  statStability.textContent = gameState.stability.toFixed(1);
  statSatisfaction.textContent = gameState.satisfaction.toFixed(1);
  statMoney.textContent = Math.floor(gameState.money);
  statAdmit.textContent = gameState.admitRate.toFixed(0)+"%";
}
refreshStatUI();

// ===================== 【事件系统核心】 =====================
// 事件池，在这里新增/修改事件
const eventPool = [
  {
    id:"event_first_day",
    triggered:false,
    // 触发条件，返回布尔值，可以写多条件 && ||
    condition: function(){
      return gameDate.month ===9 && gameDate.day ===2 && gameDate.hour >=8;
    },
    title:"开学第一天",
    desc:"新学期正式开启，大量新生入校，校园内一片喧闹。部分家长担心食宿条件向校方咨询，你需要做出回应。",
    options:[
      {
        text:"耐心接待，增加后勤人手",
        effect:{money:-10000, satisfaction:+5, stability:0, admitRate:0}
      },
      {
        text:"简化流程，优先保障教学",
        effect:{money:+3000, satisfaction:-3, stability:+2, admitRate:0}
      }
    ]
  },
  {
    id:"event_money_short",
    triggered:false,
    condition:function(){
      return gameState.money < 100000;
    },
    title:"经费紧张警告",
    desc:"学校账户资金不足，部分维护项目面临停工风险。校董事会向你询问后续方案。",
    options:[
      {
        text:"削减非必要绿化维护",
        effect:{money:+20000, stability:-4, satisfaction:0, admitRate:0}
      },
      {
        text:"申请向上级追加拨款",
        effect:{money:+10000, satisfaction:+2, stability:0, admitRate:0}
      }
    ]
  }
];

// 打开事件弹窗
function showEvent(eventObj){
  eventTitle.innerText = eventObj.title;
  eventDesc.innerText = eventObj.desc;
  eventOptionWrap.innerHTML = '';
  eventObj.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = "eventOption";

    // 拼接变化小字
    let effectTextParts = [];
    if(opt.effect.stability !== 0) effectTextParts.push(`稳定度 ${opt.effect.stability >0 ? '+' : ''}${opt.effect.stability}`);
    if(opt.effect.satisfaction !== 0) effectTextParts.push(`满意度 ${opt.effect.satisfaction >0 ? '+' : ''}${opt.effect.satisfaction}`);
    if(opt.effect.money !== 0) effectTextParts.push(`资金 ${opt.effect.money >0 ? '+' : ''}${opt.effect.money}`);
    if(opt.effect.admitRate !== 0) effectTextParts.push(`升学率 ${opt.effect.admitRate >0 ? '+' : ''}${opt.effect.admitRate}`);
    const effectText = effectTextParts.join('，');

    btn.innerHTML = `
      <div>${opt.text}</div>
      <div style="font-size:12px;opacity:0.7;margin-top:4px;">${effectText}</div>
    `;

    btn.onclick = ()=>{
      gameState.stability += opt.effect.stability;
      gameState.satisfaction += opt.effect.satisfaction;
      gameState.money += opt.effect.money;
      gameState.admitRate += opt.effect.admitRate;
      // 数值边界限制，防止溢出
      gameState.stability = Math.max(0, Math.min(100, gameState.stability));
      gameState.satisfaction = Math.max(0, Math.min(100, gameState.satisfaction));
      gameState.admitRate = Math.max(0, Math.min(100, gameState.admitRate));
      // 更新UI，关闭弹窗
      refreshStatUI();
      eventOverlay.style.display = "none";
    };
    eventOptionWrap.appendChild(btn);
  })
  eventOverlay.style.display = "flex";
}

// 每tick检测事件
function checkEvents(){
  for(let evt of eventPool){
    if(evt.triggered) continue;
    if(evt.condition()){
      evt.triggered = true;
      showEvent(evt);
      break; // 同一时间只弹出一个事件
    }
  }
}

function tickGameTime(){
  if(timeSpeed === 0) return;
  gameDate.hour += timeSpeed;
  if(gameDate.hour >=24){
    gameDate.hour -= 24;
    gameDate.day += 1;
    const monthDayMap = {9:30,10:31,11:30,12:31};
    const maxDay = monthDayMap[gameDate.month] ?? 30;
    if(gameDate.day > maxDay){
      gameDate.day = 1;
      gameDate.month += 1;
    }
  }
  renderGameTime();
  checkEvents(); // 每次时间推进，检测事件
}
renderGameTime();
setInterval(tickGameTime, 1000);
</script>
